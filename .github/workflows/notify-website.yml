name: Update Readme and Notify Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update README category index and counts
        run: node scripts/update-readme.mjs

      - name: Commit and push if README changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update README tip directory index and counts [skip ci]"
            git push origin main
          else
            echo "README.md is already up to date."
          fi

      - name: Trigger mrpunyapal.dev build
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "❌ WEBSITE_DISPATCH_TOKEN secret is not set. Skipping dispatch."
            exit 1
          fi
          curl --fail --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/MrPunyapal/mrpunyapal.dev/dispatches \
            -d '{"event_type": "tips-updated"}'
          echo "✅ Dispatch sent successfully!"
