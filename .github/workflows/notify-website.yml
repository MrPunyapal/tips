name: Notify Website of Tips Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mrpunyapal.dev build
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "❌ WEBSITE_DISPATCH_TOKEN secret is not set. Skipping dispatch."
            exit 1
          fi
          curl --fail --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/MrPunyapal/mrpunyapal.dev/dispatches \
            -d '{"event_type": "tips-updated"}'
          echo "✅ Dispatch sent successfully!"
